services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl}
      POSTGRES_DB: ${POSTGRES_DB:-secop}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres ejecuta estos .sql en orden alfabético la PRIMERA vez
      # que se crea el volumen (no en cada arranque).
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etl} -d ${POSTGRES_DB:-secop}"]
      interval: 5s
      timeout: 3s
      retries: 10

  etl:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-etl}:${POSTGRES_PASSWORD:-etl}@db:5432/${POSTGRES_DB:-secop}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
